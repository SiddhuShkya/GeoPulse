<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GeoPulse - Satellite Data Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body data-bs-theme="dark">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/" class="sidebar-brand d-flex align-items-center">
                <i class="fas fa-satellite me-2 text-primary"></i>
                <span class="fs-4 fw-bold">GeoPulse</span>
            </a>
            <button class="sidebar-toggle d-lg-none" id="sidebarToggle" onclick="toggleSidebar()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="/" id="nav-home">
                        <i class="fas fa-home me-2"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/interactive_map" id="nav-map">
                        <i class="fas fa-map-marked-alt me-2"></i>
                        <span>Interactive Map</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/fetch_satellite_data" id="nav-satellite">
                        <i class="fas fa-satellite-dish me-2"></i>
                        <span>Fetch Satellite Data</span>
                    </a>
                </li>
            </ul>
        </nav>
        
        <!-- Map Settings -->
        <div class="sidebar-settings">
            <div class="sidebar-divider"></div>
            <div class="sidebar-settings-content">
                <h6 class="sidebar-settings-title">
                    <i class="fas fa-cog me-2"></i>Map Settings
                </h6>
                <div class="sidebar-settings-body">
                    <label class="form-label small">
                        <i class="fas fa-layer-group me-1"></i>Map Type
                    </label>
                    <select id="globalMapType" class="form-select form-select-sm" onchange="changeGlobalMapType()">
                        <option value="Default">🗺️ Default (OpenStreetMap)</option>
                        <option value="Satellite">🛰️ Satellite</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Mobile Header -->
        <div class="mobile-header d-lg-none">
            <button class="mobile-menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <a href="/" class="mobile-brand">
                <i class="fas fa-satellite me-2 text-primary"></i>
                <span class="fw-bold">GeoPulse</span>
            </a>
        </div>

        <!-- Page Content -->
        <div class="content-wrapper">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script>
        // Sidebar toggle function
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // Close sidebar when clicking outside on mobile
        document.getElementById('sidebarOverlay').addEventListener('click', function() {
            if (window.innerWidth < 992) {
                toggleSidebar();
            }
        });

        // Update active nav item based on current page
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.sidebar-nav .nav-link');
            
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath || 
                    (currentPath === '/' && link.getAttribute('href') === '/') ||
                    (currentPath !== '/' && link.getAttribute('href') !== '/' && currentPath.startsWith(link.getAttribute('href')))) {
                    link.classList.add('active');
                }
            });
        });

        // Handle window resize
        window.addEventListener('resize', function() {
            if (window.innerWidth >= 992) {
                document.getElementById('sidebar').classList.remove('active');
                document.getElementById('sidebarOverlay').classList.remove('active');
            }
        });

        // Global map type change function
        function changeGlobalMapType() {
            const mapType = document.getElementById('globalMapType').value;
            
            // Call page-specific changeMapType function if it exists
            if (typeof changeMapType === 'function') {
                changeMapType();
            }
        }
        
        // Sync global map type selector when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Wait a bit for page-specific scripts to load
            setTimeout(function() {
                const globalSelector = document.getElementById('globalMapType');
                if (globalSelector && typeof changeMapType === 'function') {
                    // Trigger change to sync with any existing map
                    changeMapType();
                }
            }, 500);
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
